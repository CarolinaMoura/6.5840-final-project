<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
</head>

<body>
    <h1>WebSocket Test</h1>

    <button onclick="createRoom()" id="create-room">Create Room</button>

    <!-- <form onsubmit="send(); return false;">
        <input id="msg" type="text" placeholder="Type a message...">
        <button onclick="send()">Send</button>
    </form> -->

    <div id="log">
        <h2>Network Events:</h2>
    </div>

    <script>
        let ws;

        // Check if already is in a room
        const room = window.location.pathname.split("/")[2];
        if (room) {
            joinRoom(room);
        }
        else {
            const createRoomButton = document.getElementById("create-room");
            createRoomButton.style.display = "block";
        }

        function appendLog(m) {
            const log = document.getElementById("log");
            const p = document.createElement("p");
            p.innerText = "➡️ " + m;
            log.appendChild(p);
        }

        async function createRoom() {
            const { room } = await fetch("/rooms", { method: "POST" }).then(r => r.json());
            await joinRoom(room);
        }
        connect();

        async function joinRoom(room) {
            ws = new WebSocket(`ws://${location.host}/ws/rooms/${room}`);

            window.history.pushState({}, "", `/rooms/${room}`);

            ws.onopen = () => appendLog("Connected to signaling server via WebSocket");
            ws.onmessage = e => appendLog(e.data);
            ws.onclose = () => appendLog("Disconnected from signaling server.");
        }


        function send() {
            const input = document.getElementById("msg");
            ws.send(input.value);
            log.textContent += "Sent: " + input.value + "\n";
            input.value = "";
        }
    </script>
</body>

<style>
    #log {
        margin: 5%;
        border: 1px solid black;
        min-height: 50vh;
    }

    #create-room {
        display: none;
    }
</style>

</html>
