# 3-node signaling cluster. Each container runs both the fiber HTTP server
# and a raft peer in the same process (raft replaces the old etcd cluster).
#
# Ports per container:
#   - 8080 (internal): fiber HTTP / websocket  → host-mapped to 8081/8082/8083
#   - 7001 (internal): raft + kv gRPC          → not host-mapped (intra-net only)
#
# Address spaces:
#   - Raft peers (CLI args, intra-network):   node{1,2,3}:7001
#   - Advertise addrs (browser-visible):      localhost:808{1,2,3}
#
# From your Mac:    open http://localhost:8081 (or 8082, 8083)
# From a container: node1:7001, etc.
#
# Caching: each container has its own GOCACHE (a named volume) — sharing it
# via a bind-mounted host dir deadlocks because Docker's bind-mount FS doesn't
# play nice with Go's cache locks under concurrent compilation. Module cache
# (immutable downloads) is shared safely.

x-node-common: &node-common
  image: golang:1.25
  working_dir: /app
  networks:
    - signaling-net

services:
  node1:
    <<: *node-common
    container_name: node1
    hostname: node1
    volumes:
      - .:/app
      - gocache-node1:/root/.cache/go-build
      - gomodcache:/go/pkg/mod
    environment:
      ADVERTISE_ADDR: localhost:8081
      ME: "0"
      RAFT_DATA_DIR: /app/data/node1
      SIGNALING_ADDRS: localhost:8081,localhost:8082,localhost:8083
    ports:
      - "8081:8080"
    command:
      - go
      - run
      - .
      - "8080"
      - "node1:7001"
      - "node2:7001"
      - "node3:7001"

  node2:
    <<: *node-common
    container_name: node2
    hostname: node2
    volumes:
      - .:/app
      - gocache-node2:/root/.cache/go-build
      - gomodcache:/go/pkg/mod
    environment:
      ADVERTISE_ADDR: localhost:8082
      ME: "1"
      RAFT_DATA_DIR: /app/data/node2
      SIGNALING_ADDRS: localhost:8081,localhost:8082,localhost:8083
    ports:
      - "8082:8080"
    command:
      - go
      - run
      - .
      - "8080"
      - "node1:7001"
      - "node2:7001"
      - "node3:7001"

  node3:
    <<: *node-common
    container_name: node3
    hostname: node3
    volumes:
      - .:/app
      - gocache-node3:/root/.cache/go-build
      - gomodcache:/go/pkg/mod
    environment:
      ADVERTISE_ADDR: localhost:8083
      ME: "2"
      RAFT_DATA_DIR: /app/data/node3
      SIGNALING_ADDRS: localhost:8081,localhost:8082,localhost:8083
    ports:
      - "8083:8080"
    command:
      - go
      - run
      - .
      - "8080"
      - "node1:7001"
      - "node2:7001"
      - "node3:7001"

networks:
  signaling-net:
    driver: bridge

volumes:
  gocache-node1:
  gocache-node2:
  gocache-node3:
  gomodcache:
