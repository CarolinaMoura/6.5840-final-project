# 3-node etcd cluster for local development.
# Each node:
#   - listens on 0.0.0.0:2379 (clients) and 0.0.0.0:2380 (peers) inside its container
#   - advertises its container DNS name to its peers (etcd1/etcd2/etcd3)
#   - exposes its client port to your Mac on 2379, 2389, 2399 respectively
#
# From your Mac:    etcdctl --endpoints=localhost:2379,localhost:2389,localhost:2399 ...
# From a container: etcd1:2379, etcd2:2379, etcd3:2379

x-etcd-common: &etcd-common
  image: quay.io/coreos/etcd:v3.5.12
  restart: unless-stopped
  networks:
    - etcd-net

x-etcd-env: &etcd-env
  ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: dev-cluster-token
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_LOG_LEVEL: info

services:
  etcd1:
    <<: *etcd-common
    container_name: etcd1
    hostname: etcd1
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
    ports:
      - "2379:2379"
    volumes:
      - etcd1-data:/etcd-data
    command:
      - etcd
      - --data-dir=/etcd-data

  etcd2:
    <<: *etcd-common
    container_name: etcd2
    hostname: etcd2
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
    ports:
      - "2389:2379"
    volumes:
      - etcd2-data:/etcd-data
    command:
      - etcd
      - --data-dir=/etcd-data

  etcd3:
    <<: *etcd-common
    container_name: etcd3
    hostname: etcd3
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
    ports:
      - "2399:2379"
    volumes:
      - etcd3-data:/etcd-data
    command:
      - etcd
      - --data-dir=/etcd-data

  signaling1:
    image: golang:1.25
    working_dir: /app
    environment:
      - ADVERTISE_ADDR=localhost:8081
      - GOCACHE=/app/.gocache
      - GOMODCACHE=/app/.gomodcache
    ports:
      - "8081:8080"
    volumes:
      - .:/app
    networks:
      - etcd-net
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    command:
      - go
      - run
      - .
      - "8080"
      - "etcd1:2379"
      - "etcd2:2379"
      - "etcd3:2379"

networks:
  etcd-net:
    driver: bridge

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
